name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'

      - name: Verify scripts
        run: make check-scripts

      - name: Run Go tests
        run: make go-test

      - name: Build Linux ARM64 binary
        run: make build-linux-arm64

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build iOS app
        run: make ios-build-sim
